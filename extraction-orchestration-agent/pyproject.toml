[project]
name = "extraction-orchestration-agent"
version = "0.1.0"
description = "Group A: Python ADK Field Extractor & Orchestrator Agent"
authors = [{ name = "Enterprise Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "google-genai>=0.1.0",
    "google-auth>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
