name: CI/CD Pipeline & Cloud Run Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: mcp-lud-wew
  GCP_REGION: europe-west3
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER || 'projects/121116282931/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT || 'github-actions-builder@mcp-lud-wew.iam.gserviceaccount.com' }}

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Detect which container services have file changes
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changed Containers
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      extraction: ${{ steps.filter.outputs.extraction }}
      governance: ${{ steps.filter.outputs.governance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'cockpit-frontend/**'
            extraction:
              - 'extraction-orchestration-agent/**'
            governance:
              - 'compliance-governance-agent/**'

  # ---------------------------------------------------------------------------
  # Step 2: Deploy cockpit-frontend (only if frontend files changed)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Cockpit Frontend
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (cockpit-frontend)
        run: |
          gcloud run deploy cockpit-frontend \
            --source ./cockpit-frontend \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --allow-unauthenticated \
            --quiet

  # ---------------------------------------------------------------------------
  # Step 3: Deploy extraction-orchestration-agent (only if python agent changed)
  # ---------------------------------------------------------------------------
  deploy-extraction:
    name: Deploy Extraction Orchestrator
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.extraction == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (extraction-orchestration-agent)
        run: |
          gcloud run deploy extraction-orchestration-agent \
            --source ./extraction-orchestration-agent \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --allow-unauthenticated \
            --quiet

  # ---------------------------------------------------------------------------
  # Step 4: Deploy compliance-governance-agent (only if go agent changed)
  # ---------------------------------------------------------------------------
  deploy-governance:
    name: Deploy Go Governance Agent
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (compliance-governance-agent)
        run: |
          gcloud run deploy compliance-governance-agent \
            --source ./compliance-governance-agent \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --allow-unauthenticated \
            --quiet
